---
name: RitiBackup
version: "1.2.0"
slug: ritibackup
description: >-
  Home Assistant backups to WebDAV, S3, and Backblaze B2 (use one or many),
  with optional on-device ChaCha20-Poly1305 encryption, an automatic
  every-N-days schedule, per-backend smart retention, and one-click restore.
url: "https://github.com/sahelea1/ha-riti-webdav-backup/tree/main/ritibackup"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-lock
panel_title: RitiBackup
hassio_api: true
hassio_role: manager
homeassistant_api: false
map:
  - backup:rw
options:
  encryption_enabled: false
  encryption_passphrase: ""
  webdav_enabled: false
  webdav_url: ""
  webdav_username: ""
  webdav_password: ""
  webdav_path: "/RitiBackup"
  webdav_verify_ssl: true
  s3_enabled: false
  s3_endpoint_url: ""
  s3_region: ""
  s3_bucket: ""
  s3_access_key_id: ""
  s3_secret_access_key: ""
  s3_prefix: "RitiBackup"
  s3_path_style: false
  b2_enabled: false
  b2_key_id: ""
  b2_application_key: ""
  b2_bucket: ""
  b2_prefix: "RitiBackup"
  schedule_time: "03:00"
  schedule_interval_days: 2
  run_missed_on_start: true
  keep_recent: 4
  archive_age_days: 14
  keep_bridge: false
  kdf_n_log2: 16
  chunk_size_kib: 64
  backup_name_prefix: "RitiBackup"
  delete_local_after_upload: true
  compress_supervisor_backup: true
  log_level: "info"
schema:
  encryption_enabled: "bool"
  encryption_passphrase: "password"
  webdav_enabled: "bool"
  webdav_url: "str"
  webdav_username: "str"
  webdav_password: "password"
  webdav_path: "str"
  webdav_verify_ssl: "bool"
  s3_enabled: "bool"
  s3_endpoint_url: "str"
  s3_region: "str"
  s3_bucket: "str"
  s3_access_key_id: "str"
  s3_secret_access_key: "password"
  s3_prefix: "str"
  s3_path_style: "bool"
  b2_enabled: "bool"
  b2_key_id: "str"
  b2_application_key: "password"
  b2_bucket: "str"
  b2_prefix: "str"
  schedule_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  schedule_interval_days: "int(1,30)"
  run_missed_on_start: "bool"
  keep_recent: "int(1,50)"
  archive_age_days: "int(1,365)"
  keep_bridge: "bool"
  kdf_n_log2: "int(14,20)"
  chunk_size_kib: "int(16,1024)"
  backup_name_prefix: "str"
  delete_local_after_upload: "bool"
  compress_supervisor_backup: "bool"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
